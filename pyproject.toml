[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetly"
version = "1.0.0"
description = "Meeting transcription and intelligence toolkit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "sounddevice>=0.4.6",
    "aiortc>=1.5.0",
    "numpy>=1.24.0",
    "av>=11.0.0",
    "faster-whisper>=0.10.0",
    "pyannote.audio>=3.0.0",
    "sentence-transformers>=2.2.0",
]

[tool.setuptools]
package-dir = {meetly = "."}
packages = [
    "meetly",
    "meetly.api",
    "meetly.audio",
    "meetly.audio.integrations",
    "meetly.audio.integrations.google_meet",
    "meetly.audio.integrations.google_meet.media",
    "meetly.audio.processing",
    "meetly.audio.processing.ai",
    "meetly.audio.processing.diarization",
    "meetly.audio.processing.live_transcription",
    "meetly.audio.processing.transcript",
    "meetly.audio.recorder",
    "meetly.core",
    "meetly.llm",
]
