[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetly"
version = "1.0.0"
description = "Meeting transcription and intelligence toolkit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiortc>=1.5.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.1",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
]

[tool.setuptools.packages.find]
include = [
    "meetly*",
    "api*",
    "audio*",
    "core*",
    "llm*",
]
